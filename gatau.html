<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Happy Stranger 💖 I Miss You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2d1b2e, #4a2c4a, #5c3a5c);
            overflow: hidden;
            font-family: 'Segoe UI', 'Georgia', cursive;
            color: #fff;
            position: relative;
            padding: 20px;
        }

        /* ===== Efek Partikel Lembut ===== */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 182, 193, 0.4);
            border-radius: 50%;
            animation: floatParticle 8s ease-in-out infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* ===== Tulisan "Be Happy Stranger" ===== */
        .main-text {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 600;
            letter-spacing: 6px;
            margin-bottom: 50px;
            position: relative;
            display: inline-block;
            text-align: center;
        }
        .main-text span {
            display: inline-block;
            color: #ffd1dc;
            text-shadow: 
                0 0 10px rgba(255, 182, 193, 0.8),
                0 0 20px rgba(255, 105, 180, 0.5),
                0 0 30px rgba(255, 20, 147, 0.3);
            animation: letterDance 2.5s ease-in-out infinite;
        }
        /* Penundaan agar setiap huruf bergerak bergantian */
        .main-text span:nth-child(odd) { animation-delay: 0.1s; }
        .main-text span:nth-child(even) { animation-delay: 0.3s; }

        @keyframes letterDance {
            0%, 100% {
                transform: translateY(0) scale(1);
                color: #ffd1dc;
                text-shadow: 
                    0 0 10px rgba(255, 182, 193, 0.8),
                    0 0 20px rgba(255, 105, 180, 0.5);
            }
            25% {
                transform: translateY(-12px) rotate(-3deg) scale(1.05);
                color: #ffb6c1;
            }
            50% {
                transform: translateY(0) scale(1);
                color: #ffc0cb;
                text-shadow: 
                    0 0 15px rgba(255, 192, 203, 1),
                    0 0 30px rgba(255, 105, 180, 0.7);
            }
            75% {
                transform: translateY(-8px) rotate(3deg) scale(1.03);
                color: #ffd6e0;
            }
        }

        /* ===== Hati Terpanah & Berdenyut ===== */
        .heart-container {
            position: relative;
            margin: 20px 0 40px;
        }
        .heart {
            width: 130px;
            height: 120px;
            position: relative;
            animation: heartbeat 1.4s ease-in-out infinite;
        }
        .heart-left, .heart-right {
            position: absolute;
            top: 0;
            width: 65px;
            height: 100px;
            background: linear-gradient(to bottom, #ff4d6d, #c9184a);
            border-radius: 65px 65px 0 0;
            box-shadow: 
                0 0 25px rgba(255, 77, 109, 0.4),
                inset 0 -10px 20px rgba(167, 13, 106, 0.3);
        }
        .heart-left {
            left: 65px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
            animation: crackLeft 2s ease-in-out infinite;
        }
        .heart-right {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
            animation: crackRight 2s ease-in-out infinite;
        }
        .crack-line {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 3px;
            height: 95px;
            background: linear-gradient(to bottom, #2c2c2c, #555);
            transform: translateX(-50%) rotate(8deg);
            border-radius: 2px;
            z-index: 5;
        }
        .arrow {
            position: absolute;
            width: 150px;
            height: 6px;
            background: linear-gradient(to right, #8b4513, #d4a574);
            top: 50%;
            left: -15px;
            transform: translateY(-50%) rotate(-18deg);
            border-radius: 3px;
            z-index: 10;
            animation: arrowShoot 3s ease-in-out infinite;
        }
        .arrow::before {
            content: '';
            position: absolute;
            right: -12px;
            top: -7px;
            border-left: 25px solid #b0c4de;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
        }
        .arrow::after {
            content: '';
            position: absolute;
            left: -10px;
            top: -4px;
            border-right: 12px solid #deb887;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes crackLeft {
            0%, 100% { transform: rotate(-45deg); }
            50% { transform: rotate(-41deg) translateX(-5px); }
        }
        @keyframes crackRight {
            0%, 100% { transform: rotate(45deg); }
            50% { transform: rotate(41deg) translateX(5px); }
        }
        @keyframes arrowShoot {
            0%, 100% { transform: translateY(-50%) rotate(-18deg) translateX(0); }
            50% { transform: translateY(-50%) rotate(-18deg) translateX(6px); }
        }

        /* ===== Pesan "I miss you" ===== */
        .miss-text {
            font-size: 1.8rem;
            color: #ffc2d1;
            text-shadow: 
                0 0 12px rgba(255, 194, 209, 0.6),
                0 0 25px rgba(255, 105, 180, 0.4);
            margin-top: 10px;
            letter-spacing: 4px;
            animation: missGlow 2.5s ease-in-out infinite alternate;
            position: relative;
        }
        .heart-icon {
            display: inline-block;
            animation: iconPulse 1.2s ease-in-out infinite;
            margin: 0 8px;
        }

        @keyframes missGlow {
            0% {
                opacity: 0.7;
                text-shadow: 
                    0 0 12px rgba(255, 194, 209, 0.5),
                    0 0 25px rgba(255, 105, 180, 0.3);
            }
            100% {
                opacity: 1;
                text-shadow: 
                    0 0 20px rgba(255, 194, 209, 0.9),
                    0 0 35px rgba(255, 105, 180, 0.6);
            }
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>

    <!-- Efek Partikel Mengambang -->
    <div class="particles"></div>

    <!-- Tulisan Utama -->
    <div class="main-text" id="mainText"></div>

    <!-- Hati Terpanah -->
    <div class="heart-container">
        <div class="heart">
            <div class="heart-left"></div>
            <div class="heart-right"></div>
            <div class="crack-line"></div>
            <div class="arrow"></div>
        </div>
    </div>

    <!-- Pesan Rindu -->
    <p class="miss-text"><span class="heart-icon">💕</span> I miss you <span class="heart-icon">💕</span></p>

    <script>
        // Tulisan utama dibagi per huruf agar bergerak sendiri-sendiri
        const text = "BE HAPPY STRANGER";
        const textContainer = document.getElementById('mainText');
        [...text].forEach(char => {
            const span = document.createElement('span');
            span.textContent = char === ' ' ? '\u00A0' : char;
            textContainer.appendChild(span);
        });

        // Buat partikel hiasan berwarna pink
        const particlesContainer = document.querySelector('.particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.width = `${Math.random() * 10 + 5}px`;
            particle.style.height = particle.style.width;
            particle.style.animationDuration = `${Math.random() * 6 + 6}s`;
            particle.style.animationDelay = `${Math.random() * 8}s`;
            particlesContainer.appendChild(particle);
        }
    </script>

</body>
</html>
