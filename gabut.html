<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Cinematic Web-Crawler Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .cinematic-hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            border-left: 2px solid #e62429;
            padding-left: 12px;
            text-shadow: 0 0 10px rgba(230, 36, 41, 0.5);
        }

        .cinematic-hud h1 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #fff;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="cinematic-hud">
        <h1>Spider-Man: New York Vertical Sweep</h1>
        <p>Dynamic Cinematic Simulation // Rigged Anatomy & Web Physics</p>
    </div>

    <!-- Memuat Three.js untuk rendering 3D sinematik -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Inisialisasi Scene, Camera, dan Renderer bergaya sinematik film
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0c16, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Pencahayaan Dramatis ala Film (Atmospheric & Moody)
        const ambientLight = new THREE.AmbientLight(0x1a2138, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(20, 40, 25);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Lampu Neon Kota dari samping untuk efek teatrikal
        const neonBlue = new THREE.PointLight(0x00aaff, 3, 50);
        neonBlue.position.set(-15, 10, 10);
        scene.add(neonBlue);

        const neonRed = new THREE.PointLight(0xff0044, 3, 50);
        neonRed.position.set(15, 25, 10);
        scene.add(neonRed);

        // Pembuatan Gedung Pencakar Langit (The Building Facade)
        const buildingGroup = new THREE.Group();
        const buildingGeo = new THREE.BoxGeometry(20, 70, 15);
        
        // Material kaca gedung reflektif gelap
        const buildingMat = new THREE.MeshStandardMaterial({
            color: 0x111622,
            roughness: 0.2,
            metalness: 0.8
        });
        const building = new THREE.Mesh(buildingGeo, buildingMat);
        building.position.set(0, 25, -5);
        building.receiveShadow = true;
        buildingGroup.add(building);

        // Menambahkan detail jendela-jendela kecil bercahaya secara prosedural
        const windowMat = new THREE.MeshBasicMaterial({ color: 0xffe89b });
        const windowGeom = new THREE.PlaneGeometry(0.8, 1.2);
        
        for(let wy = -20; wy < 55; wy += 3) {
            for(let wx = -8; wx <= 8; wx += 3) {
                if(Math.random() > 0.3) {
                    const win = new THREE.Mesh(windowGeom, windowMat);
                    win.position.set(wx, wy, 2.51);
                    buildingGroup.add(win);
                    
                    const winBack = new THREE.Mesh(windowGeom, windowMat);
                    winBack.position.set(wx, wy, -2.51);
                    winBack.rotation.y = Math.PI;
                    buildingGroup.add(winBack);
                }
            }
        }
        scene.add(buildingGroup);

        // --- PEMBUATAN ANATOMI TUBUH SPIDER-MAN LENGKAP & RIGGED ---
        const spideyGroup = new THREE.Group();

        // Material Kostum Ikonik (Merah & Biru dengan sentuhan tekstur fisik sinematik)
        const redSuitMat = new THREE.MeshStandardMaterial({
            color: 0xd91414,
            roughness: 0.3,
            metalness: 0.2
        });

        const blueSuitMat = new THREE.MeshStandardMaterial({
            color: 0x0f2a66,
            roughness: 0.4,
            metalness: 0.2
        });

        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const blackLineMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });

        // 1. Kepala (Head)
        const headGeo = new THREE.SphereGeometry(0.6, 32, 32);
        headGeo.scale(1, 1.15, 1);
        const head = new THREE.Mesh(headGeo, redSuitMat);
        head.position.set(0, 3.8, 0);
        head.castShadow = true;

        // Mata Tajam Khas Film (Eyepieces)
        const eyeGeo = new THREE.BufferGeometry();
        // Bentuk mata menyipit sinematik
        const eyeShape = new THREE.Shape();
        eyeShape.moveTo(0, 0);
        eyeShape.bezierCurveTo(0.2, 0.2, 0.4, 0.05, 0.5, -0.2);
        eyeShape.bezierCurveTo(0.2, -0.15, 0.05, -0.1, 0, 0);
        
        const eyeExtrudeSettings = { depth: 0.05, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
        const leftEyeGeo = new THREE.ExtrudeGeometry(eyeShape, eyeExtrudeSettings);
        const leftEye = new THREE.Mesh(leftEyeGeo, eyeMat);
        leftEye.position.set(0.18, 3.9, 0.45);
        leftEye.rotation.set(0.1, 0.3, -0.2);
        leftEye.scale.set(0.8, 0.8, 0.8);

        const rightEye = leftEye.clone();
        rightEye.position.set(-0.18, 3.9, 0.45);
        rightEye.rotation.set(0.1, -0.3, 0.2);
        rightEye.scale.set(-0.8, 0.8, 0.8); // Mirroring mata kanan

        head.add(leftEye);
        head.add(rightEye);
        spideyGroup.add(head);

        // 2. Torso / Dada & Perut (Chest & Abdomen) dengan Lambang Laba-laba
        const torsoGeo = new THREE.CylinderGeometry(0.55, 0.4, 1.8, 16);
        const torso = new THREE.Mesh(torsoGeo, redSuitMat);
        torso.position.set(0, 2.5, 0);
        torso.castShadow = true;
        spideyGroup.add(torso);

        // Pinggang & Panggul (Pelvis)
        const pelvisGeo = new THREE.CylinderGeometry(0.4, 0.45, 0.8, 16);
        const pelvis = new THREE.Mesh(pelvisGeo, blueSuitMat);
        pelvis.position.set(0, 1.4, 0);
        pelvis.castShadow = true;
        spideyGroup.add(pelvis);

        // 3. Lengan Kanan (Right Arm - Pundak, Siku, Telapak menempel di tembok)
        const rightArmGroup = new THREE.Group();
        rightArmGroup.position.set(0.7, 3.1, 0);
        
        const rShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), redSuitMat);
        rightArmGroup.add(rShoulder);

        const rUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.18, 1.0, 12), redSuitMat);
        rUpperArm.position.set(0, -0.5, 0);
        rightArmGroup.add(rUpperArm);

        const rLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 1.0, 12), blueSuitMat);
        rLowerArm.position.set(0, -1.5, 0);
        rightArmGroup.add(rLowerArm);

        // Telapak Tangan (Hand) menempel di gedung
        const rHand = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.3, 0.1), redSuitMat);
        rHand.position.set(0, -2.1, 0.1);
        rightArmGroup.add(rHand);
        spideyGroup.add(rightArmGroup);

        // 4. Lengan Kiri (Left Arm - Mengangkat tangan bersiap menembakkan jaring!)
        const leftArmGroup = new THREE.Group();
        leftArmGroup.position.set(-0.7, 3.1, 0);

        const lShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), redSuitMat);
        leftArmGroup.add(lShoulder);

        const lUpperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.18, 1.0, 12), redSuitMat);
        lUpperArm.position.set(0, -0.5, 0);
        leftArmGroup.add(lUpperArm);

        const lLowerArm = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 1.0, 12), blueSuitMat);
        lLowerArm.position.set(0, -1.5, 0);
        leftArmGroup.add(lLowerArm);

        const lHand = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.3, 0.1), redSuitMat);
        lHand.position.set(0, -2.1, 0);
        leftArmGroup.add(lHand);
        spideyGroup.add(leftArmGroup);

        // 5. Kaki Kanan (Right Leg - Posisi memanjat dinamis)
        const rightLegGroup = new THREE.Group();
        rightLegGroup.position.set(0.35, 1.0, 0);

        const rThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 1.3, 12), blueSuitMat);
        rThigh.position.set(0, -0.65, 0);
        rightLegGroup.add(rThigh);

        const rCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 1.3, 12), redSuitMat);
        rCalf.position.set(0, -1.9, 0);
        rightLegGroup.add(rCalf);

        const rFoot = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.5), redSuitMat);
        rFoot.position.set(0, -2.6, 0.15);
        rightLegGroup.add(rFoot);
        spideyGroup.add(rightLegGroup);

        // 6. Kaki Kiri (Left Leg - Menekuk siap melompat)
        const leftLegGroup = new THREE.Group();
        leftLegGroup.position.set(-0.35, 1.0, 0);

        const lThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 1.3, 12), blueSuitMat);
        lThigh.position.set(0, -0.65, 0);
        leftLegGroup.add(lThigh);

        const lCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 1.3, 12), redSuitMat);
        lCalf.position.set(0, -1.9, 0);
        leftLegGroup.add(lCalf);

        const lFoot = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.5), redSuitMat);
        lFoot.position.set(0, -2.6, 0.15);
        leftLegGroup.add(lFoot);
        spideyGroup.add(leftLegGroup);

        // Posisikan seluruh tubuh Spider-Man menempel di dinding gedung
        spideyGroup.position.set(0, 10, 2.6);
        scene.add(spideyGroup);

        // --- FITUR UTAMA: EFEK JARING LABA-LABA (WEB SHOOTER PHYSICS) ---
        const webLineMat = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.8,
            linewidth: 3
        });

        const webPoints = [
            new THREE.Vector3(-0.7, 1.0, 2.6), // Titik asal dari pergelangan tangan kiri Spider-Man
            new THREE.Vector3(-8, 30, 15)      // Titik target menempel di angkasa / gedung seberang
        ];
        const webGeo = new THREE.BufferGeometry().setFromPoints(webPoints);
        const webLine = new THREE.Line(webGeo, webLineMat);
        scene.add(webLine);

        // Partikel Debu Sinematik (Cinematic Dust Particles)
        const particleCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 50;
            particlePositions[i+1] = Math.random() * 70;
            particlePositions[i+2] = (Math.random() - 0.5) * 50;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x88ccff,
            size: 0.15,
            transparent: true,
            opacity: 0.5
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- ANIMASI SEOLAH HIDUP (CINEMATIC RIGID & ORGANIC MOTION) ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            let elapsedTime = clock.getElapsedTime();

            // 1. Simulasi Gerakan Memanjat Gedung (Vertical Climbing Motion)
            let climbSpeed = 1.5;
            let verticalPos = 10 + Math.sin(elapsedTime * climbSpeed) * 6;
            spideyGroup.position.y = verticalPos;

            // 2. Animasi Anggota Tubuh Lentur & Realistis ala Akrobatik Film
            // Otot dada bernapas / meregang saat bergerak
            torso.scale.y = 1 + Math.sin(elapsedTime * 4) * 0.05;

            // Gerakan Lengan Kanan (Menempel mencengkeram dinding secara bergantian)
            rightArmGroup.rotation.z = 0.2 + Math.sin(elapsedTime * climbSpeed * 2) * 0.15;
            rightArmGroup.rotation.x = Math.cos(elapsedTime * climbSpeed) * 0.2;

            // Gerakan Lengan Kiri (Dinamika aksi siap menembak jaring)
            leftArmGroup.rotation.x = -0.5 + Math.sin(elapsedTime * 3) * 0.2;
            leftArmGroup.rotation.z = -0.4;

            // Gerakan Kaki melangkah dinamis di dinding
            rightLegGroup.rotation.x = Math.sin(elapsedTime * climbSpeed * 2) * 0.4;
            leftLegGroup.rotation.x = -Math.sin(elapsedTime * climbSpeed * 2) * 0.4;

            // Kepala bergerak natural melihat situasi sekitar
            head.rotation.y = Math.sin(elapsedTime * 1.5) * 0.2;
            head.rotation.x = Math.cos(elapsedTime * 2) * 0.1;

            // 3. Efek Dinamis Penembakan Jaring Laba-laba (Web-Shooting Pulsation)
            // Jaring bergetar tegang seolah menahan beban gravitasi tubuh Spider-Man
            const positions = webLine.geometry.attributes.position.array;
            // Titik awal jaring mengikuti tangan kiri Spider-Man secara akurat
            positions[0] = spideyGroup.position.x - 0.7;
            positions[1] = spideyGroup.position.y + 1.0;
            positions[2] = spideyGroup.position.z;

            // Sedikit efek elastisitas pada jaring (Spider-Web Elasticity Physics)
            positions[3] = -8 + Math.sin(elapsedTime * 10) * 0.2; // Titik jangkar bergetar tertahan
            positions[4] = 30 + Math.cos(elapsedTime * 8) * 0.2;
            webLine.geometry.attributes.position.needsUpdate = true;

            // 4. Pergerakan Kamera Sinematik (Cinematic Orbiting & Dramatic Pan)
            camera.position.x = Math.sin(elapsedTime * 0.3) * 22;
            camera.position.z = 25 + Math.cos(elapsedTime * 0.3) * 8;
            camera.position.y = spideyGroup.position.y + 3; // Kamera mengikuti ketinggian panjat Spider-Man
            camera.lookAt(0, spideyGroup.position.y, 0);

            // 5. Animasi Partikel Melayang di Udara Kota Malam
            const pAttributes = particleGeo.attributes.position.array;
            for(let i = 1; i < pAttributes.length; i += 3) {
                pAttributes[i] -= 0.05; // Partikel jatuh perlahan
                if(pAttributes[i] < 0) pAttributes[i] = 70; // Reset ke atas jika menyentuh tanah
            }
            particleGeo.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Responsif terhadap ukuran jendela browser
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
