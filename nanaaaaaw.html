<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i miss you 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e0, #ffb3c6, #ff8fab);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 60px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 1.5s ease-out forwards;
            opacity: 0;
        }

        .text {
            font-size: 4.5rem;
            font-weight: bold;
            color: #c2185b;
            text-shadow: 3px 3px 6px rgba(194, 24, 91, 0.25);
            letter-spacing: 3px;
        }

        .text span {
            display: inline-block;
            animation: bounce 1.2s ease-in-out infinite alternate;
        }

        /* Jeda animasi tiap huruf */
        .text span:nth-child(1) { animation-delay: 0s; }
        .text span:nth-child(2) { animation-delay: 0.1s; }
        .text span:nth-child(3) { animation-delay: 0.2s; }
        .text span:nth-child(4) { animation-delay: 0.3s; }
        .text span:nth-child(5) { animation-delay: 0.4s; }
        .text span:nth-child(6) { animation-delay: 0.5s; }
        .text span:nth-child(7) { animation-delay: 0.6s; }
        .text span:nth-child(8) { animation-delay: 0.7s; }
        .text span:nth-child(9) { animation-delay: 0.8s; }
        .text span:nth-child(10) { animation-delay: 0.9s; }

        .heart {
            font-size: 4rem;
            color: #ff4d6d;
            display: inline-block;
            animation: heartbeat 0.9s ease-in-out infinite alternate;
            margin: 0 10px;
        }

        .sub-text {
            margin-top: 20px;
            font-size: 1.3rem;
            color: #ed88b4;
            opacity: 0.85;
            animation: pulse 2s ease-in-out infinite;
        }

        /* Animasi */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }

        @keyframes heartbeat {
            from { transform: scale(1); }
            to { transform: scale(1.3); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Hiasan hati melayang */
        .floating-heart {
            position: absolute;
            color: #ff8fab;
            font-size: 1.5rem;
            animation: floatUp 6s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Hati melayang latar -->
    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">💕</div>
    <div class="floating-heart" style="left: 25%; animation-delay: 1.2s;">💗</div>
    <div class="floating-heart" style="left: 40%; animation-delay: 2.4s;">💖</div>
    <div class="floating-heart" style="left: 60%; animation-delay: 0.8s;">💓</div>
    <div class="floating-heart" style="left: 75%; animation-delay: 2.0s;">💕</div>
    <div class="floating-heart" style="left: 90%; animation-delay: 1.5s;">💗</div>

    <div class="container">
        <h1 class="text">
            <span>I</span>
            <span class="heart">❤️</span>
            <span>L</span><span>o</span><span>v</span><span>e</span>
            <span class="heart">❤️</span>
            <span>Y</span><span>o</span><span>u</span>
        </h1>
        <p class="sub-text">be happy stranger 💞</p>
    </div>
</body>
</html>
